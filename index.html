<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
:root{
  --parch:#f5ede0;--parch2:#efe4ce;--parch3:#e8d9b8;--parch4:#ddc99a;
  --dark:#1a1208;--dark2:#2a1e0a;--ink:#2c1a06;--ink2:#5a3e1b;--ink3:#8a6a3a;
  --gold:#9a7020;--gold2:#c49a30;--gold3:#e8c860;
  --red:#8b1a1a;--border:rgba(154,112,32,0.3);--border2:rgba(154,112,32,0.6);
  --steel:#2c3e50;--fire:#c0392b;
}
body{background:var(--dark);color:var(--ink);font-family:'Crimson Pro',serif;font-size:15px}
h1,h2,h3,h4{font-family:'Cinzel',serif;letter-spacing:.05em}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--parch2)}::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:3px}
.btn{font-family:'Crimson Pro',serif;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink2);border-radius:4px;padding:5px 13px;font-size:13px;transition:all .12s;white-space:nowrap}
.btn:hover{background:rgba(154,112,32,0.1)}
.btn.act{background:rgba(154,112,32,0.2);border-color:var(--gold2);color:var(--gold3)}
.btn.red{border-color:var(--red);color:var(--red)}

/* Leaflet overrides */
.leaflet-container{background:#1a2a1a;font-family:'Crimson Pro',serif}
.leaflet-control-attribution{display:none}
.leaflet-control-zoom a{background:rgba(20,12,4,0.9)!important;border-color:var(--gold2)!important;color:var(--gold3)!important;font-size:16px!important}
.leaflet-control-zoom a:hover{background:rgba(154,112,32,0.3)!important}

/* Map marker styles */
.sf-pin{cursor:pointer;transition:transform .15s}
.sf-pin:hover{transform:scale(1.15)}
.sf-terrain-label{
  background:transparent;border:none;box-shadow:none;

.sf-terrain-label:hover{color:var(--gold);text-shadow:0 0 8px rgba(200,160,40,0.6)}
.sf-region-polygon{cursor:pointer}

.map-lore-popup{
  position:absolute;z-index:1000;background:rgba(26,18,8,0.97);
  border:1px solid var(--gold2);border-radius:8px;padding:16px;
  width:260px;box-shadow:0 4px 20px rgba(0,0,0,0.6);
  font-family:'Crimson Pro',serif;
}

/* Loading */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:40px;height:40px;border:3px solid rgba(200,160,40,0.2);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite}

/* Tales archive */
.tales-banner{background:rgba(40,30,10,0.8);border:1px solid var(--border2);border-radius:4px;padding:6px 14px;font-family:Cinzel,serif;font-size:10px;letter-spacing:0.1em;color:var(--ink3);text-align:center;margin-bottom:12px}

.sh-num{font-family:Cinzel,serif;background:rgba(255,255,255,0.6);border:1px solid #b8a070;color:#2a2a3a;font-size:14px;width:100%;padding:2px 4px;outline:none;border-radius:2px;text-align:center}
.sh-input-box{font-family:'Crimson Pro',serif;background:rgba(255,255,255,0.6);border:1px solid #b8a070;color:#2a2a3a;font-size:13px;width:100%;padding:3px 6px;outline:none;border-radius:2px}
.sh-input-box:focus{border-color:#888;background:white}
.sh-input{font-family:'Crimson Pro',serif;background:transparent;border:none;border-bottom:1px solid #b8a070;color:#2a2a3a;font-size:13px;width:100%;padding:2px 0;outline:none}
.prof-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #888;background:transparent;display:inline-block;cursor:pointer;flex-shrink:0;transition:background .15s}
.prof-dot.filled{background:#2a2a3a}
.death-box{width:22px;height:22px;border:2px solid #aaa;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(255,255,255,0.5);transition:all .15s;flex-shrink:0}
.death-box.red{background:rgba(160,0,0,0.2);border-color:#8b1a1a}

    setTimeout(()=>{
      const m=document.getElementById("loading-msg");if(m)m.textContent="Taking longer than expected.";
      const b=document.getElementById("reset-btn");if(b)b.style.display="block";
    },7000);
  </script>
</div>

// Global loader hide - called by React when ready
window.hideAppLoader=function(){
  var ld=document.getElementById("loading-screen");
  if(ld)ld.style.display="none";
};
// Nuclear fallback - hide after 10s no matter what
setTimeout(function(){window.hideAppLoader();},10000);
</script>

/* ════ SUPABASE ════ */
const SB_KEY="sf_supabase_v1";
const getSBConfig=()=>{try{const r=localStorage.getItem(SB_KEY);return r?JSON.parse(r):null}catch{return null}};
const saveSBConfig=c=>{try{localStorage.setItem(SB_KEY,JSON.stringify(c))}catch{}};
let _sb=null;
const getSB=()=>_sb;
const initSB=(url,key)=>{_sb={url:url.replace(/\/$/,""),key};return _sb;};
function sbH(sb,extra){
  // New sb_publishable_ keys only need apikey header, NOT Authorization Bearer
  // Old eyJ... JWT keys need both
  const isJWT=sb.key&&sb.key.startsWith("eyJ");
  const headers={"apikey":sb.key};
  if(isJWT)headers["Authorization"]=`Bearer ${sb.key}`;
  return{...headers,...(extra||{})};
}

async function dbUpsert(sb,id,payload,retries=3){
  for(let attempt=1;attempt<=retries;attempt++){
    try{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),20000);
      const r=await fetch(`${sb.url}/rest/v1/campaign`,{method:"POST",headers:sbH(sb,{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"}),body:JSON.stringify({id,data:payload,updated_at:new Date().toISOString()}),signal:ctrl.signal});
      clearTimeout(t);if(r.ok)return;
      const txt=await r.text().catch(()=>`${r.status}`);
      if(attempt<retries){await new Promise(res=>setTimeout(res,1500*attempt));continue;}
      throw new Error(`DB save failed (${r.status}): ${txt.slice(0,200)}`);
    }catch(e){if(attempt===retries)throw e;await new Promise(res=>setTimeout(res,1500*attempt));}
  }
}
async function dbFetchAll(sb){
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${sb.url}/rest/v1/campaign?select=id,data&limit=2000`,{headers:sbH(sb),signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)return[];
    return await r.json();
  }catch{return[];}
}
async function dbDelete(sb,id){try{await fetch(`${sb.url}/rest/v1/campaign?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:sbH(sb)});}catch{}}

function stripImages(data){
  const imgs={};const d=JSON.parse(JSON.stringify(data));
  if(d.mapImage){imgs["v2_img_map"]=d.mapImage;d.mapImage=null;}
  (d.characters||[]).forEach(c=>{if(c.portrait){imgs[`v2_img_c_${c.id}`]=c.portrait;c.portrait=null;}});
  const SECS=Object.keys(d.lore||{});
  SECS.forEach(sec=>{(d.lore[sec]||[]).forEach(e=>{if(e.portrait){imgs[`v2_img_l_${e.id}`]=e.portrait;e.portrait=null;}if(e.fileData){imgs[`v2_img_f_${e.id}`]=e.fileData;e.fileData=null;}});});
  return{stripped:d,imgs};
}
function reattachImages(data,imgs){
  if(!data)return data;const d=JSON.parse(JSON.stringify(data));
  d.mapImage=imgs["v2_img_map"]||null;
  (d.characters||[]).forEach(c=>{c.portrait=imgs[`v2_img_c_${c.id}`]||null;});
  Object.keys(d.lore||{}).forEach(sec=>{(d.lore[sec]||[]).forEach(e=>{e.portrait=imgs[`v2_img_l_${e.id}`]||null;e.fileData=imgs[`v2_img_f_${e.id}`]||null;});});
  return d;
}

async function dbLoad(sb){
  const rows=await dbFetchAll(sb);if(!rows||!rows.length)return null;
  const defaultSections={allies:[],enemies:[],factions:[],settlements:[],history:[],sessions:[],terrain:[]};
  const lore={...defaultSections};let characters=null,mapItems=null,customSections=[];const imgs={};let hasV2=false;
  rows.forEach(({id,data:d})=>{
    if(!d&&d!==0)return;
    if(id==="sf_lore"){Object.keys(d).forEach(s=>{lore[s]=d[s]||[];});customSections=(d.__customSections||[]);hasV2=true;}
    else if(id==="sf_chars"){characters=d;hasV2=true;}
    else if(id==="sf_map"){mapItems=(d&&d.mapItems)||[];hasV2=true;}
    else if(id==="sf_meta"){if(d.customSections)customSections=d.customSections;}
    else if(id.startsWith("v2_img_")){imgs[id]=typeof d==="string"?d:((d&&d.v)||null);}
  });
  if(!hasV2)return null;
  const assembled={lore:{...lore,__customSections:customSections},characters:characters||[],mapItems:mapItems||[],mapImage:null};
  return reattachImages(assembled,imgs);
}

async function dbSave(sb,data){
  const{stripped,imgs}=stripImages(data);
  const lorePay={...stripped.lore};
  await dbUpsert(sb,"sf_lore",lorePay);
  await dbUpsert(sb,"sf_chars",stripped.characters||[]);
  await dbUpsert(sb,"sf_map",{mapItems:stripped.mapItems||[]});
  for(const[key,val] of Object.entries(imgs)){if(!val)continue;try{await dbUpsert(sb,key,val);}catch(e){console.warn(`Image save failed ${key}:`,e);}}
}

async function loadAssets(sb){
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${sb.url}/rest/v1/campaign?id=like.sf_asset_%&select=id,data&limit=50`,{headers:sbH(sb),signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)return;
    const rows=await r.json();
    rows.forEach(({id,data:d})=>{
      if(id==="sf_asset_barony_map"&&(d&&d.img)){
        window._baronyMapImg=d.img;
      } else if(id.startsWith("sf_asset_icon_")&&(d&&d.img)){
        const iconName=id.replace("sf_asset_icon_","");
        BARONY_ICONS[iconName]=d.img;
      }
    });
    console.log(`Loaded ${Object.keys(BARONY_ICONS).length} icons from Supabase`);
  }catch(e){console.warn("Asset load failed:",e);}
}

async function saveBaronyMap(sb,imgData){

/* ════ IMAGE COMPRESSION ════ */
function compressImage(file,maxSize=400,quality=0.72){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas");let w=img.width,h=img.height;if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;}}else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;}}canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",quality));};img.src=e.target.result;};
    reader.readAsDataURL(file);
  });
}

function WorldMap({data,setData,onNavigate}){

    if(leafletRef.current)return;

    if(!el)return;

    const W=1400,H=1000;

      crs:L.CRS.Simple,minZoom:-2,maxZoom:2,zoomSnap:0.5,
      attributionControl:false,zoomControl:true,
      center:[H/2,W/2],zoom:-1,
    });
    leafletRef.current=map;

    if(data.mapImage){
      L.imageOverlay(data.mapImage,[[0,0],[H,W]],{opacity:1,zIndex:1}).addTo(map);
    }

    // Oghill Barony region polygon — white dashed border, centre-left of landmass
    const baronyCoordsLatLng=[
      [520,310],[530,360],[520,410],[505,450],[488,475],[465,490],
      [440,500],[415,495],[395,480],[380,455],[370,425],[370,395],
      [378,365],[395,340],[420,322],[450,312],[480,308],[510,312],[520,310]

    const baronyPoly=L.polygon(baronyCoordsLatLng,{
      color:"rgba(255,255,255,0.85)",weight:2,
      fill:false,dashArray:"8,5",interactive:true,

    baronyPoly.on("mouseover",()=>baronyPoly.setStyle({color:"white",weight:3,dashArray:"none"}));

      L.DomEvent.stopPropagation(e);

        setPopup({name:item.label,desc:item.notes||"No notes.",isBarony:false});
      });
    });

    map.on("click",()=>{setPopup(null);if(activeRing){activeRing.remove();activeRing=null;}});
    return()=>{map.remove();leafletRef.current=null;};
  },[]);

  useEffect(()=>{
    if(!leafletRef.current||!data.mapImage)return;

/* ════ BARONY MAP ════
   Base: blank map image (no icons)
   Icons are placed as Leaflet image markers at exact positions
   Hidden settlements are completely invisible to players
   DM sees everything; players only see revealed settlements
   White ellipse highlight appears around clicked icon
════════════════════════════════════════════════════ */
function BaronyMap({data,setData,onBack,isDM}){
  const leafletRef=useRef(null);
  const [popup,setPopup]=useState(null);
  const [activeHL,setActiveHL]=useState(null); // active highlight layer

  // Revealed state lives in data.baronyRevealed = {id: true/false}
  const revealed=data.baronyRevealed||{bai:true};
  const setRevealed=(id,val)=>{
    setData(d=>({...d,baronyRevealed:{...(d.baronyRevealed||{bai:true}),[id]:val}}));
  };

  useEffect(()=>{
    if(leafletRef.current)return;
    const L=window.L;
    const el=document.getElementById("barony-map-container");
    if(!el)return;

    // Map coordinate space matches image: 1400 wide x 1050 tall
    const W=1400,H=1050;
    const map=L.map(el,{
      crs:L.CRS.Simple,minZoom:-1,maxZoom:2,zoomSnap:0.25,
      attributionControl:false,zoomControl:true,
      center:[H/2,W/2],zoom:0,
    });
    leafletRef.current=map;

    // Always show blank base map
    const mapSrc=window._baronyMapImg||data.baronyImage;if(mapSrc)L.imageOverlay(mapSrc,[[0,0],[H,W]],{opacity:1,zIndex:1}).addTo(map);

    // Place icons and click zones for each settlement
    BARONY_SETTLEMENTS.forEach(s=>{
      // CRS.Simple: lat = H-iy (y from bottom), lng = ix (x from left)
      const ll=[H-s.iy, s.ix];
      const isRevealed=revealed[s.id]||s.revealed;
      const canSee=isDM||isRevealed;
      if(!canSee)return; // completely hidden for players

      let iconLayer=null;
      const iconSrc=BARONY_ICONS[s.icon]||(window._baronyIcons&&window._baronyIcons[s.icon]);if(s.icon&&iconSrc){
        // Place the icon image on the map
        // Icon displayed at ~120x90 pixels
        const iconW=120,iconH=90;
        const iconBounds=[[H-s.iy-iconH/2,s.ix-iconW/2],[H-s.iy+iconH/2,s.ix+iconW/2]];
        iconLayer=L.imageOverlay(iconSrc,iconBounds,{
          opacity:isDM&&!isRevealed?0.4:1, // DM sees hidden as faded
          zIndex:10,interactive:false,
          className:"barony-icon",
        }).addTo(map);
      } else {
        // Text label for settlements without icons
        const lbl=L.divIcon({
          className:"sf-terrain-label",
          html:`<span style="background:rgba(20,12,4,0.75);padding:2px 6px;border-radius:3px;color:#e8c860;border:1px solid rgba(200,160,40,0.5)">${s.name}</span>`,
          iconSize:[140,22],iconAnchor:[70,11]
        });
        L.marker(ll,{icon:lbl,interactive:false}).addTo(map);
      }

      // Invisible click zone over the icon
      const zone=L.circleMarker(ll,{
        radius:40,color:"transparent",fillColor:"transparent",
        fillOpacity:0,weight:0,interactive:true,zIndex:20,
      }).addTo(map);

      zone.on("mouseover",()=>{
        zone.setStyle({color:"rgba(255,255,255,0.35)",weight:2,fillColor:"rgba(255,255,255,0.05)",fillOpacity:1});
      });
      zone.on("mouseout",()=>{
        zone.setStyle({color:"transparent",fillColor:"transparent",fillOpacity:0,weight:0});
      });
      zone.on("click",e=>{
        L.DomEvent.stopPropagation(e);
        // Remove old highlight
        if(activeHL)activeHL.remove();
        // Draw white ellipse highlight around icon
        const hl=L.ellipse?
          L.ellipse(ll,[55,65],0,{color:"white",weight:2.5,fill:false,opacity:0.9,zIndex:30}).addTo(map):
          L.circleMarker(ll,{radius:52,color:"white",weight:2.5,fill:false,opacity:0.9,zIndex:30}).addTo(map);
        setActiveHL(hl);
        setPopup({...s,isRevealed:isRevealed||s.revealed});
      });

      // DM: show faded label for hidden items
      if(isDM&&!isRevealed&&s.icon){
        const dmLbl=L.divIcon({
          className:"sf-terrain-label",
          html:`<span style="background:rgba(139,0,0,0.6);padding:1px 4px;border-radius:2px;color:#ff9999;font-size:9px;border:1px solid rgba(255,100,100,0.4)">${s.name}</span>`,
          iconSize:[120,16],iconAnchor:[60,8]
        });
        L.marker([H-s.iy-55,s.ix],{icon:dmLbl,interactive:false}).addTo(map);
      }
    });

    // Terrain labels
    BARONY_TERRAIN.forEach(t=>{
      const ll=[H-t.iy,t.ix];
      const zone=L.circleMarker(ll,{radius:30,color:"transparent",fillColor:"transparent",fillOpacity:0,weight:0,interactive:true}).addTo(map);
      zone.on("click",e=>{L.DomEvent.stopPropagation(e);setPopup({...t,type:"terrain",isRevealed:true});});
    });

    map.on("click",()=>{setPopup(null);if(activeHL){activeHL.remove();setActiveHL(null);}});
    return()=>{map.remove();leafletRef.current=null;};
  },[isDM, JSON.stringify(revealed)]);

  // Re-render map when revealed state changes (need full rebuild)
  // We use key prop on parent to trigger this

  const handleBaronyUpload=async e=>{
    const f=(e.target.files&&e.target.files[0]);if(!f)return;
    const compressed=await compressImage(f,2400,0.85);
    setData(d=>({...d,baronyImage:compressed}));
  };

  return(<div style={{position:"relative",width:"100%",height:"100%"}}>
    <div style={{position:"absolute",top:12,left:12,zIndex:1000,display:"flex",gap:8,alignItems:"center"}}>
      <button className="btn act" onClick={onBack} style={{background:"rgba(20,12,4,0.9)",fontSize:12}}>← World Map</button>
      <div style={{fontFamily:"Cinzel",fontSize:13,color:"var(--gold3)",background:"rgba(20,12,4,0.8)",padding:"4px 12px",borderRadius:4,border:"1px solid var(--gold2)"}}>Oghill Barony</div>
      {isDM&&<div style={{fontFamily:"Cinzel",fontSize:10,color:"#ff9999",background:"rgba(80,0,0,0.8)",padding:"3px 8px",borderRadius:3,border:"1px solid rgba(255,100,100,0.4)"}}>⚔ DM VIEW</div>}
    </div>

    <div id="barony-map-container" key={JSON.stringify(revealed)+isDM} style={{width:"100%",height:"100%",borderRadius:8}}/>

    {/* Popup */}
    {popup&&<div className="map-lore-popup" style={{bottom:80,right:20,maxWidth:280}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div>
          <h3 style={{fontFamily:"Cinzel",fontSize:14,color:"var(--gold3)",letterSpacing:"0.05em"}}>{popup.name}</h3>
          <div style={{fontSize:9,color:"var(--ink3)",fontFamily:"Cinzel",letterSpacing:"0.06em",marginTop:2}}>
            {popup.type==="terrain"?"TERRAIN":"SETTLEMENT"}
            {isDM&&!popup.isRevealed&&<span style={{color:"#ff9999",marginLeft:6}}>● HIDDEN FROM PLAYERS</span>}
          </div>
        </div>
        <button onClick={()=>setPopup(null)} style={{background:"none",border:"none",color:"var(--ink3)",cursor:"pointer",fontSize:16}}>✕</button>
      </div>
      <p style={{fontSize:13,color:"rgba(240,220,180,0.85)",lineHeight:1.6,marginBottom:10}}>{popup.desc||"No description yet."}</p>
      {isDM&&popup.id&&popup.type!=="terrain"&&<>
        {!popup.isRevealed
          ?<button className="btn act" onClick={()=>{setRevealed(popup.id,true);setPopup(null);}} style={{width:"100%",fontSize:11,padding:"5px",background:"rgba(0,100,0,0.3)",borderColor:"rgba(100,200,100,0.5)",color:"#90ee90"}}>
            ✓ Reveal to Players
          </button>
          :<button className="btn" onClick={()=>{setRevealed(popup.id,false);setPopup(null);}} style={{width:"100%",fontSize:11,padding:"5px",color:"#ff9999",borderColor:"rgba(255,100,100,0.4)"}}>
            ✕ Hide from Players
          </button>}
      </>}
      {!isDM&&<button className="btn" onClick={()=>setPopup(null)} style={{width:"100%",fontSize:11,marginTop:4,padding:"3px"}}>Close</button>}
    </div>}
  </div>);
}

/* ════ LORE SECTIONS ════ */
const DEFAULT_SECTIONS=[
  {id:"allies",label:"Allies",icon:"🤝"},
  {id:"enemies",label:"Enemies",icon:"💀"},
  {id:"factions",label:"Factions",icon:"⚔️"},
  {id:"settlements",label:"Settlements",icon:"🏰"},
  {id:"history",label:"History",icon:"📖"},
  {id:"sessions",label:"Session Details",icon:"📋"},
  {id:"terrain",label:"Terrain & Locations",icon:"🗺"},
];
const EMPTY_ENTRY=()=>({id:Date.now()+Math.random(),name:"",portrait:null,raceSp:"",age:"",hairColour:"",eyeColour:"",build:"",clothing:"",voiceAccent:"",personality:"",goalSecret:"",description:"",lore:"",abilities:"",relationships:"",featsWithParty:"",threatLevel:"",tactics:"",tags:"",sessionNumber:"",sessionDate:"",keyEvents:"",fileName:"",fileData:"",linkedCharId:null,pinned:false});

/* ════ UNCONTROLLED INPUT HELPERS ════ */
const ShInput=memo(({value,onCommit,placeholder,className,style,type})=>{
  const ref=useRef(null);
  useEffect(()=>{if(ref.current&&document.activeElement!==ref.current)ref.current.value=value||"";},[value]);
  return <input ref={ref} type={type||"text"} defaultValue={value||""} onBlur={e=>onCommit(e.target.value)} placeholder={placeholder||""} className={className||"sh-input-box"} style={style}/>;
});
const ShNumInput=memo(({value,onCommit,className,style,placeholder})=>{
  const ref=useRef(null);
  useEffect(()=>{if(ref.current&&document.activeElement!==ref.current)ref.current.value=value||"";},[value]);
  return <input ref={ref} type="number" defaultValue={value||""} onBlur={e=>onCommit(e.target.value)} placeholder={placeholder||""} className={className||"sh-num"} style={style}/>;
});
const ShTextarea=memo(({value,onCommit,placeholder,className,style})=>{
  const ref=useRef(null);
  useEffect(()=>{if(ref.current&&document.activeElement!==ref.current)ref.current.value=value||"";},[value]);
  return <textarea ref={ref} defaultValue={value||""} onBlur={e=>onCommit(e.target.value)} placeholder={placeholder||""} className={className||"sh-input-box"} style={style}/>;
});

/* ════ LORE PANEL ════ */
const LoreVF=memo(({label,value,field,multi,height,editMode,onCommit})=>{
  if(!editMode&&!(value||"").trim())return null;
  return(<div style={{marginBottom:12}}>
    <div style={{fontSize:9,fontFamily:"Cinzel",color:"var(--ink3)",letterSpacing:"0.08em",marginBottom:3}}>{label.toUpperCase()}</div>
    {editMode?(multi
      ?<ShTextarea value={value||""} onCommit={v=>onCommit(field,v)} style={{fontFamily:"Crimson Pro,serif",background:"var(--parch)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:4,padding:"6px 9px",fontSize:14,width:"100%",resize:"vertical",minHeight:height||80,lineHeight:1.6,outline:"none"}}/>
      :<ShInput value={value||""} onCommit={v=>onCommit(field,v)} style={{fontFamily:"Crimson Pro,serif",background:"var(--parch)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:4,padding:"6px 9px",fontSize:14,width:"100%",outline:"none"}} className=""/>)
      :<p style={{fontSize:15,color:"var(--ink)",lineHeight:1.7,fontFamily:"Crimson Pro",whiteSpace:"pre-wrap"}}>{value}</p>}
  </div>);
});

const LoreIF=memo(({label,value,field,editMode,onCommit})=>{
  if(!editMode&&!(value||"").trim())return null;
  return(<div style={{flex:"1 1 120px"}}>
    <div style={{fontSize:9,fontFamily:"Cinzel",color:"var(--ink3)",letterSpacing:"0.08em",marginBottom:3}}>{label.toUpperCase()}</div>
    {editMode?<ShInput value={value||""} onCommit={v=>onCommit(field,v)} style={{fontFamily:"Crimson Pro,serif",background:"var(--parch)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:4,padding:"4px 7px",fontSize:13,width:"100%",outline:"none"}} className=""/>
      :<div style={{fontSize:14,color:"var(--ink)",fontFamily:"Crimson Pro"}}>{value||"—"}</div>}
  </div>);
});

function LorePanel({lore,setLore,characters,readOnly}){
  const [allSections,setAllSections]=useState(()=>{
    const custom=lore.__customSections||[];
    return[...DEFAULT_SECTIONS,...custom];
  });
  const [openSection,setOpenSection]=useState("allies");
  const [sel,setSel]=useState({s:null,id:null});
  const [creating,setCreating]=useState(null);
  const [newName,setNewName]=useState("");
  const [editMode,setEditMode]=useState(false);
  const [delT,setDelT]=useState(null);
  const [search,setSearch]=useState("");
  const [local,setLocal]=useState(null);
  const [listEditMode,setListEditMode]=useState(false);
  const [dragOver,setDragOver]=useState(null);
  const [showAddSection,setShowAddSection]=useState(false);
  const [newSectionName,setNewSectionName]=useState("");
  const dragId=useRef(null);

  const selItem=sel.s?lore[sel.s]&&lore[sel.s].find(i=>i.id===sel.id):null;
  useEffect(()=>{setLocal(selItem?{...selItem}:null);},[sel.s,sel.id]);

  const commitField=useCallback((field,value)=>{
    setLore(prev=>({...prev,[sel.s]:prev[sel.s].map(i=>i.id===sel.id?{...i,[field]:value}:i)}));
    setLocal(prev=>prev?{...prev,[field]:value}:prev);
  },[sel.s,sel.id,setLore]);

  const createItem=s=>{
    if(!newName.trim())return;
    const item={...EMPTY_ENTRY(),name:newName.trim()};
    setLore(prev=>({...prev,[s]:[...(prev[s]||[]),item]}));
    setSel({s,id:item.id});setLocal({...item});setCreating(null);setNewName("");if(!readOnly)setEditMode(true);
  };
  const reqDel=()=>{if(!selItem)return;setDelT({label:selItem.(description||"").trim()||selItem.(lore||"").trim()?selItem.name:""});};
  const confirmDel=()=>{
    setLore(prev=>({...prev,[sel.s]:prev[sel.s].filter(i=>i.id!==sel.id)}));
    setSel({s:null,id:null});setLocal(null);setDelT(null);setEditMode(false);
  };
  const togglePin=(section,id)=>{setLore(prev=>({...prev,[section]:prev[section].map(i=>i.id===id?{...i,pinned:!i.pinned}:i)}));};
  const reorder=(section,fromId,toId)=>{
    setLore(prev=>{const arr=[...(prev[section]||[])];const fi=arr.findIndex(i=>i.id===fromId);const ti=arr.findIndex(i=>i.id===toId);if(fi<0||ti<0||fi===ti)return prev;const[m]=arr.splice(fi,1);arr.splice(ti,0,m);return{...prev,[section]:arr};});
  };
  const handlePortrait=async e=>{const f=(e.target.files&&e.target.files[0]);if(!f)return;const c=await compressImage(f,400,0.72);commitField("portrait",c);};

  const addSection=()=>{
    if(!newSectionName.trim())return;
    const id="custom_"+Date.now();
    const newSec={id,label:newSectionName.trim(),icon:"📌"};
    setAllSections(prev=>[...prev,newSec]);
    setLore(prev=>({...prev,[id]:[],__customSections:[...(prev.__customSections||[]),newSec]}));
    setOpenSection(id);setShowAddSection(false);setNewSectionName("");
  };

  const filteredItems=useMemo(()=>{
    const s=openSection;if(!s||!lore[s])return[];
    const items=lore[s]||[];
    const sorted=[...items.filter(i=>i.pinned),...items.filter(i=>!i.pinned)];
    return search.trim()?sorted.filter(i=>i.(name||"").toLowerCase().includes(search.toLowerCase())):sorted;
  },[lore,openSection,search]);

  const hasPhys=s=>["allies","enemies"].includes(s);

  return(<div style={{display:"flex",height:"100%",background:"var(--dark)"}}>
    {delT&&!readOnly&&<DelModal name={delT.label} onOk={confirmDel} onNo={()=>setDelT(null)}/>}

    {/* LEFT sidebar */}
    <div style={{width:220,display:"flex",flexDirection:"column",background:"var(--parch2)",borderRight:"2px solid var(--gold2)",flexShrink:0,overflow:"hidden"}}>
      {readOnly&&<div className="tales-banner" style={{margin:"8px",fontSize:9}}>📖 BLOOD SEEKER — ARCHIVED (READ ONLY)</div>}
      <div style={{overflowY:"auto",flex:1}}>
        {allSections.map(s=>{
          const items=lore[s.id]||[];const isO=openSection===s.id;
          return(<div key={s.id} style={{borderBottom:"1px solid var(--border)"}}>
            <div style={{display:"flex",alignItems:"center",background:isO?"var(--parch3)":"var(--parch2)",borderLeft:isO?"3px solid var(--gold2)":"3px solid transparent"}}>
              <div onClick={()=>{setOpenSection(s.id);setSearch("");setListEditMode(false);}} style={{flex:1,padding:"10px 8px 10px 11px",cursor:"pointer",fontSize:12,fontFamily:"Cinzel",letterSpacing:"0.04em",color:isO?"var(--gold)":"var(--ink2)",display:"flex",alignItems:"center",gap:7,userSelect:"none"}}>
                <span>{s.icon}</span><span style={{flex:1}}>{s.label}</span>
                {items.length>0&&<span style={{fontSize:9,background:"var(--gold2)",color:"var(--dark)",borderRadius:10,padding:"0 5px",fontFamily:"Cinzel"}}>{items.length}</span>}
                <span style={{fontSize:9,color:"var(--ink3)",transform:isO?"rotate(180deg)":"none",display:"inline-block",transition:"transform .2s"}}>▼</span>
              </div>
              {isO&&!readOnly&&<button onClick={e=>{e.stopPropagation();setListEditMode(m=>!m);}} title="Reorder/pin" style={{background:listEditMode?"rgba(154,112,32,0.25)":"none",border:"none",cursor:"pointer",fontSize:12,padding:"4px 8px",color:listEditMode?"var(--gold2)":"var(--ink3)",borderLeft:"1px solid var(--border)",flexShrink:0,fontFamily:"Cinzel"}}>
                {listEditMode?"✓":"⠿"}
              </button>}
            </div>
            {isO&&<div style={{background:"var(--parch)"}}>
              {listEditMode&&<div style={{padding:"3px 10px",fontSize:9,color:"var(--ink3)",fontFamily:"Cinzel",letterSpacing:"0.05em",borderBottom:"1px solid var(--border)",background:"var(--parch2)"}}>DRAG TO REORDER · 📍 TO PIN</div>}
              {!listEditMode&&<div style={{padding:"5px 8px",borderBottom:"1px solid var(--border)"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{fontFamily:"Crimson Pro,serif",background:"var(--parch2)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:3,padding:"3px 7px",width:"100%",fontSize:11,outline:"none"}}/>
              </div>}
              {filteredItems.length===0&&<div style={{padding:"7px 14px",fontSize:11,color:"var(--ink3)",fontStyle:"italic"}}>No entries</div>}
              {filteredItems.map(item=>{
                const isSel=sel.id===item.id&&sel.s===s.id;const isDO=dragOver===item.id;
                return(<div key={item.id} draggable={listEditMode}
                  onDragStart={e=>{dragId.current=item.id;e.dataTransfer.effectAllowed="move";}}
                  onDragOver={e=>{if(!listEditMode)return;e.preventDefault();setDragOver(item.id);}}
                  onDragLeave={()=>setDragOver(null)}
                  onDrop={e=>{e.preventDefault();if(dragId.current&&dragId.current!==item.id)reorder(s.id,dragId.current,item.id);dragId.current=null;setDragOver(null);}}
                  onDragEnd={()=>{dragId.current=null;setDragOver(null);}}
                  onClick={()=>{if(!listEditMode){setSel({s:s.id,id:item.id});setEditMode(false);}}}
                  style={{padding:"7px 8px 7px 10px",cursor:listEditMode?"grab":"pointer",fontSize:12,fontFamily:"Crimson Pro",background:isDO?"var(--parch3)":isSel&&!listEditMode?"var(--parch4)":"transparent",color:isSel&&!listEditMode?"var(--gold)":"var(--ink)",borderLeft:isSel&&!listEditMode?"3px solid var(--gold2)":"3px solid transparent",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:6,borderTop:isDO?"2px solid var(--gold2)":"2px solid transparent",userSelect:"none"}}>
                  {listEditMode&&<span style={{fontSize:12,color:"var(--ink3)",flexShrink:0}}>⠿</span>}
                  {listEditMode&&!readOnly&&<button onClick={e=>{e.stopPropagation();togglePin(s.id,item.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,padding:"0 2px",color:item.pinned?"var(--gold2)":"var(--ink3)",flexShrink:0}}>{item.pinned?"📌":"📍"}</button>}
                  {!listEditMode&&item.pinned&&<span style={{fontSize:9,flexShrink:0}}>📌</span>}
                  {item.portrait&&<img src={item.portrait} alt="" style={{width:16,height:16,borderRadius:"50%",objectFit:"cover",flexShrink:0}}/>}
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name||<em style={{opacity:.5,fontSize:10}}>Unnamed</em>}</span>
                </div>);
              })}
              {!listEditMode&&!readOnly&&(creating===s.id
                ?<div style={{padding:"6px 8px",display:"flex",gap:4,borderTop:"1px solid var(--border)"}}>
                  <input autoFocus placeholder="Name..." value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")createItem(s.id);if(e.key==="Escape")setCreating(null);}} style={{fontFamily:"Crimson Pro,serif",background:"var(--parch2)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:3,padding:"3px 7px",flex:1,fontSize:11,outline:"none"}}/>
                  <button className="btn" onClick={()=>createItem(s.id)} style={{padding:"2px 6px",fontSize:11}}>✓</button>
                  <button className="btn" onClick={()=>setCreating(null)} style={{padding:"2px 6px",fontSize:11}}>✕</button>
                </div>
                :<div style={{padding:"5px 8px",borderTop:"1px solid var(--border)"}}>
                  <button className="btn" onClick={()=>setCreating(s.id)} style={{width:"100%",fontSize:10,border:"1px dashed var(--border2)",padding:"3px"}}>+ Add {s.label.replace(/s$/,"")}</button>
                </div>
              )}
            </div>}
          </div>);
        })}
      </div>
      {/* Add custom section */}
      {!readOnly&&<div style={{borderTop:"2px solid var(--border2)",padding:"8px"}}>
        {showAddSection?<div style={{display:"flex",gap:4}}>
          <input autoFocus placeholder="Section name..." value={newSectionName} onChange={e=>setNewSectionName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addSection();if(e.key==="Escape")setShowAddSection(false);}} style={{fontFamily:"Crimson Pro,serif",background:"var(--parch2)",border:"1px solid var(--border2)",color:"var(--ink)",borderRadius:3,padding:"3px 7px",flex:1,fontSize:11,outline:"none"}}/>
          <button className="btn" onClick={addSection} style={{padding:"2px 6px",fontSize:11}}>✓</button>
          <button className="btn" onClick={()=>setShowAddSection(false)} style={{padding:"2px 6px",fontSize:11}}>✕</button>
        </div>:<button className="btn" onClick={()=>setShowAddSection(true)} style={{width:"100%",fontSize:10,border:"1px dashed var(--border2)",padding:"4px",color:"var(--ink3)"}}>+ New Category</button>}
      </div>}
    </div>

    {/* RIGHT detail */}
    <div style={{flex:1,overflowY:"auto",background:"var(--parch)"}}>
      {!local?<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",color:"var(--ink3)",textAlign:"center",padding:40}}>
        <div style={{fontSize:50,marginBottom:14,opacity:.28}}>{(allSections.find(s=>s.id===openSection)||{}).icon||"📜"}</div>
        <h3 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--ink3)",marginBottom:8}}>{(allSections.find(s=>s.id===openSection)||{}).label||"Lore"}</h3>
        <p style={{fontSize:14,color:"var(--ink3)",fontStyle:"italic"}}>{readOnly?"Archived — read only":"Select or create an entry"}</p>
      </div>:
      <div style={{padding:"24px 32px",maxWidth:820,margin:"0 auto"}}>
        {readOnly&&<div className="tales-banner">📖 BLOOD SEEKER — ARCHIVED READ ONLY</div>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
          <div style={{flex:1,marginRight:14}}>
            {editMode&&!readOnly?<ShInput value={local.name||""} onCommit={v=>commitField("name",v)} style={{fontSize:24,fontFamily:"Cinzel",color:"var(--gold)",background:"transparent",border:"none",borderBottom:"2px solid var(--gold2)",padding:"2px 0",width:"100%",outline:"none"}} className=""/>
              :<h2 style={{fontSize:24,color:"var(--gold)",letterSpacing:"0.06em"}}>{local.name||"Unnamed"}</h2>}
            {!editMode&&local.raceSp&&<p style={{fontSize:13,color:"var(--ink3)",marginTop:3,fontStyle:"italic",fontFamily:"Cinzel"}}>{local.raceSp}{local.age?` · Age ${local.age}`:""}</p>}
          </div>
          {!readOnly&&<div style={{display:"flex",gap:5,flexShrink:0}}>
            <button className={`btn${editMode?" act":""}`} onClick={()=>setEditMode(m=>!m)} style={{fontSize:12,padding:"4px 11px"}}>{editMode?"✓ Done":"✏️ Edit"}</button>
            {editMode&&<button className="btn red" onClick={reqDel} style={{fontSize:12,padding:"4px 9px"}}>🗑</button>}
          </div>}
        </div>
        <Ornament/>
        <div style={{display:"flex",gap:20,marginBottom:18,flexWrap:"wrap"}}>
          <div style={{flexShrink:0}}>
            <div style={{width:140,height:180,background:"var(--parch2)",border:"2px solid var(--border2)",borderRadius:4,overflow:"hidden",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {local.portrait?<img src={local.portrait} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{color:"var(--ink3)",fontSize:11,fontStyle:"italic",textAlign:"center",padding:8}}>No portrait</div>}
              {editMode&&!readOnly&&<label style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,0.65)",color:"var(--gold3)",fontSize:10,textAlign:"center",padding:"4px",cursor:"pointer",fontFamily:"Cinzel"}}>📷 Upload<input type="file" accept="image/*" onChange={handlePortrait} style={{display:"none"}}/></label>}
            </div>
          </div>
          {hasPhys(sel.s)&&<div style={{flex:1}}>
            <div style={{fontSize:9,fontFamily:"Cinzel",color:"var(--ink3)",letterSpacing:"0.08em",marginBottom:8}}>PHYSICAL ATTRIBUTES</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
              <LoreIF label="Race / Species" value={local.raceSp} field="raceSp" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Age" value={local.age} field="age" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Eye Colour" value={local.eyeColour} field="eyeColour" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Hair Colour" value={local.hairColour} field="hairColour" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Build" value={local.build} field="build" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Clothing" value={local.clothing} field="clothing" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Voice / Accent" value={local.voiceAccent} field="voiceAccent" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Personality" value={local.personality} field="personality" editMode={editMode&&!readOnly} onCommit={commitField}/>
              <LoreIF label="Goal or Secret" value={local.goalSecret} field="goalSecret" editMode={editMode&&!readOnly} onCommit={commitField}/>
            </div>
          </div>}
        </div>
        <Ornament/>
        <LoreVF label="Description" value={local.description} field="description" multi height={100} editMode={editMode&&!readOnly} onCommit={commitField}/>

// [Abbreviated for space — full sheet with all features]
function CharSheet({char,onChange}){

  const commitNum=useCallback((f,v)=>commit(f,parseInt(v)||0),[commit]);
  const prof=parseInt(((L.statRows||[]).find(r=>r.label==="PROF BONUS")||{}).value)||parseInt(L.profBonus)||2;

  const updSR=(id,f,v)=>commit("statRows",(L.statRows||[]).map(r=>r.id===id?{...r,[f]:v}:r));

  const [cfO,setCfO]=useState({});const updCF=(id,f,v)=>commit("classFeatures",(L.classFeatures||[]).map(x=>x.id===id?{...x,[f]:v}:x));const addCF=()=>commit("classFeatures",[...(L.classFeatures||[]),{id:Date.now(),name:"",desc:""}]);const delCF=id=>commit("classFeatures",(L.classFeatures||[]).filter(x=>x.id!==id));
  const [knO,setKnO]=useState({});const updKn=(id,f,v)=>commit("knacks",(L.knacks||[]).map(x=>x.id===id?{...x,[f]:v}:x));const addKn=()=>commit("knacks",[...(L.knacks||[]),{id:Date.now(),name:"",desc:""}]);const delKn=id=>commit("knacks",(L.knacks||[]).filter(x=>x.id!==id));
  const [exO,setExO]=useState({});const updEx=(id,f,v)=>commit("exploits",(L.exploits||[]).map(x=>x.id===id?{...x,[f]:v}:x));const addEx=()=>commit("exploits",[...(L.exploits||[]),{id:Date.now(),name:"",desc:""}]);const delEx=id=>commit("exploits",(L.exploits||[]).filter(x=>x.id!==id));
  const [ftO,setFtO]=useState({});const updFt=(id,f,v)=>commit("featsArr",(L.featsArr||[]).map(x=>x.id===id?{...x,[f]:v}:x));const addFt=()=>commit("featsArr",[...(L.featsArr||[]),{id:Date.now(),name:"",desc:""}]);const delFt=id=>commit("featsArr",(L.featsArr||[]).filter(x=>x.id!==id));
  const togAP=k=>commit("armorProf",{...L.armorProf,[k]:!(L.armorProf&&L.armorProf[k])});
  const setCurr=(k,v)=>commit("currency",{...L.currency,[k]:v});
  const setMagAtt=(i,v)=>{const a=[...(L.magicAttunements||["","",""])];a[i]=v;commit("magicAttunements",a);};
  const toggleSaveProf=ab=>{const cur=(L.savingThrows&&L.savingThrows[ab])||{prof:false,override:null};commit("savingThrows",{...L.savingThrows,[ab]:{...cur,prof:!cur.prof}});};

  const toggleSkillProf=sk=>{const cur=(L.skills&&L.skills[sk])||{prof:false,override:null};commit("skills",{...L.skills,[sk]:{...cur,prof:!cur.prof}});};
  const setSkillOverride=(sk,v)=>{const cur=(L.skills&&L.skills[sk])||{prof:false,override:null};commit("skills",{...L.skills,[sk]:{...cur,override:v===""?null:v}});};

      </div>

        <div className="sh-label">DESCRIPTION</div>

/* ════ DM TAB ════ */
const DM_PASSWORD="HarveysBalls";

function DMTab({data,setData,lore,setLore,sbCfg}){
  const [authed,setAuthed]=useState(()=>sessionStorage.getItem("sf_dm")==="1");
  const [pw,setPw]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const [activeSection,setActiveSection]=useState("overview");

  const tryLogin=()=>{
    if(pw===DM_PASSWORD){sessionStorage.setItem("sf_dm","1");setAuthed(true);}
    else{setPwErr(true);setTimeout(()=>setPwErr(false),1500);}
  };

  if(!authed)return(
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--dark)"}}>
      <div style={{background:"var(--parch)",border:"2px solid var(--gold2)",borderRadius:10,padding:36,width:340,boxShadow:"0 8px 40px rgba(0,0,0,0.6)"}}>
        <h2 style={{fontFamily:"Cinzel",fontSize:18,color:"var(--gold)",marginBottom:6,letterSpacing:"0.08em"}}>⚔ DM Access</h2>
        <p style={{fontSize:13,color:"var(--ink2)",marginBottom:20,lineHeight:1.6}}>Enter the DM password to access campaign master controls.</p>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&tryLogin()}
          placeholder="Password..." autoFocus
          style={{fontFamily:"Crimson Pro,serif",background:pwErr?"rgba(139,26,26,0.1)":"var(--parch2)",border:`1px solid ${pwErr?"var(--red)":"var(--border2)"}`,color:"var(--ink)",borderRadius:4,padding:"8px 12px",width:"100%",fontSize:14,outline:"none",marginBottom:12,transition:"border-color .2s"}}/>
        {pwErr&&<p style={{color:"var(--red)",fontSize:12,marginBottom:10}}>Incorrect password.</p>}
        <button onClick={tryLogin} style={{fontFamily:"Cinzel",background:"var(--gold2)",color:"var(--dark)",border:"none",borderRadius:5,padding:"10px 24px",fontSize:13,cursor:"pointer",width:"100%",letterSpacing:"0.06em"}}>Enter →</button>
      </div>
    </div>
  );

  const ALL_SECTIONS=["allies","enemies","factions","settlements","history","sessions","terrain"];
  const dmLoreKey="dm_lore"; // dm lore stored in data.dmLore
  const dmLore=data.dmLore||{};
  const setDmLore=fn=>setData(d=>({...d,dmLore:typeof fn==="function"?fn(d.dmLore||{}):fn}));

  // Revealed state
  const baronyRevealed=data.baronyRevealed||{bai:true};
  const setRevealedById=(id,val)=>setData(d=>({...d,baronyRevealed:{...(d.baronyRevealed||{bai:true}),[id]:val}}));

  return(<div style={{display:"flex",height:"100%",background:"var(--dark)"}}>
    {/* DM Sidebar */}
    <div style={{width:200,background:"rgba(40,0,0,0.9)",borderRight:"2px solid rgba(200,50,50,0.4)",display:"flex",flexDirection:"column",flexShrink:0}}>
      <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(200,50,50,0.3)"}}>
        <div style={{fontFamily:"Cinzel",fontSize:13,color:"#ff9999",letterSpacing:"0.08em"}}>⚔ DM MODE</div>
        <div style={{fontSize:10,color:"rgba(255,150,150,0.5)",marginTop:2}}>Josh only</div>
      </div>
      {[
        {id:"overview",label:"Overview",icon:"📊"},
        {id:"map",label:"Map Control",icon:"🗺"},
        {id:"lore",label:"DM Lore",icon:"📖"},
        {id:"reveal",label:"Reveal Manager",icon:"👁"},
      ].map(s=><div key={s.id} onClick={()=>setActiveSection(s.id)}
        style={{padding:"10px 14px",cursor:"pointer",fontSize:12,fontFamily:"Cinzel",letterSpacing:"0.04em",
          color:activeSection===s.id?"#ffaaaa":"rgba(255,150,150,0.6)",
          background:activeSection===s.id?"rgba(139,26,26,0.4)":"transparent",
          borderLeft:activeSection===s.id?"3px solid #ff6666":"3px solid transparent",
          display:"flex",alignItems:"center",gap:8}}>
        <span>{s.icon}</span><span>{s.label}</span>
      </div>)}
      <div style={{flex:1}}/>
      <button onClick={()=>{sessionStorage.removeItem("sf_dm");setAuthed(false);}}
        style={{margin:10,fontFamily:"Cinzel",background:"transparent",border:"1px solid rgba(255,100,100,0.3)",color:"rgba(255,150,150,0.6)",borderRadius:4,padding:"6px",fontSize:10,cursor:"pointer",letterSpacing:"0.06em"}}>
        🔒 Lock DM
      </button>
    </div>

    {/* DM Content */}
    <div style={{flex:1,overflowY:"auto",background:"rgba(20,5,5,0.95)",padding:24}}>

      {activeSection==="overview"&&<>
        <h2 style={{fontFamily:"Cinzel",fontSize:18,color:"#ff9999",marginBottom:16,letterSpacing:"0.08em"}}>Campaign Overview</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
          {[
            {label:"Revealed Locations",val:Object.values(baronyRevealed).filter(Boolean).length+1,total:BARONY_SETTLEMENTS.length},
            {label:"Player Lore Entries",val:ALL_SECTIONS.reduce((n,s)=>n+(lore[s]||[]).length,0),total:""},
            {label:"DM Hidden Notes",val:Object.keys(dmLore).length,total:""},
          ].map((stat,i)=><div key={i} style={{background:"rgba(80,0,0,0.3)",border:"1px solid rgba(200,50,50,0.2)",borderRadius:6,padding:"12px 16px"}}>
            <div style={{fontSize:22,fontFamily:"Cinzel",color:"#ffaaaa",fontWeight:700}}>{stat.val}{stat.total?<span style={{fontSize:12,color:"rgba(255,150,150,0.4)"}}>/{stat.total}</span>:""}</div>
            <div style={{fontSize:10,color:"rgba(255,150,150,0.5)",fontFamily:"Cinzel",letterSpacing:"0.06em",marginTop:2}}>{stat.label.toUpperCase()}</div>
          </div>)}
        </div>
        <div style={{background:"rgba(80,0,0,0.2)",border:"1px solid rgba(200,50,50,0.2)",borderRadius:6,padding:16}}>
          <div style={{fontFamily:"Cinzel",fontSize:11,color:"rgba(255,150,150,0.6)",letterSpacing:"0.06em",marginBottom:10}}>SETTLEMENT STATUS</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {BARONY_SETTLEMENTS.map(s=>{
              const rev=baronyRevealed[s.id]||s.revealed;

                const f=(e.target.files&&e.target.files[0]);if(!f)return;

          <div style={{fontSize:11,color:"rgba(255,150,150,0.5)"}}>
            {Object.keys(BARONY_ICONS).length>0?`✓ ${Object.keys(BARONY_ICONS).length} icons loaded`:"✕ Icons not uploaded"}
          </div>
          {Object.keys(BARONY_ICONS).length===0&&<div style={{marginTop:6}}>
            <label className="btn" style={{cursor:"pointer",fontSize:10,padding:"3px 10px",color:"#ff9999",borderColor:"rgba(200,50,50,0.4)"}}>
              Upload Icon Sheet (the labelled icons image)<input type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{
                const f=(e.target.files&&e.target.files[0]);if(!f)return;
                // Slice the icon sheet into individual icons and upload each
                const reader=new FileReader();
                reader.onload=async ev=>{
                  const img=new Image();
                  img.onload=async()=>{
                    const cols=4,rows=4;
                    const iw=Math.floor(img.width/cols),ih=Math.floor(img.height/rows);
                    const iconNames=["oghill_castle","oghill_mine","black_adder_inn","belloc","mereworth_abbey","tamean_farm","mereworth","ashcombe","tabor_temple_ruins","tomb_of_illin_toth","the_old_fort","tamean_caverns","the_twin_lakes","weyhall","oghill_cliffs"];
                    const sb=getSB();
                    let done=0;
                    for(let i=0;i<iconNames.length;i++){
                      const col=i%cols,row=Math.floor(i/cols);
                      const canvas=document.createElement("canvas");
                      canvas.width=180;canvas.height=135;
                      const ctx=canvas.getContext("2d");
                      ctx.fillStyle="white";ctx.fillRect(0,0,180,135);
                      ctx.drawImage(img,col*iw,row*ih,iw,ih,0,0,180,135);
                      const dataUrl=canvas.toDataURL("image/jpeg",0.82);
                      BARONY_ICONS[iconNames[i]]=dataUrl;
                      await saveIcon(sb,iconNames[i],dataUrl).catch(()=>{});
                      done++;
                    }
                    alert(`${done} icons saved to cloud! Reload the page to see them on the map.`);
                  };
                  img.src=ev.target.result;
                };
                reader.readAsDataURL(f);
              }}/>
            </label>
          </div>}
        </div>}
        <p style={{fontSize:13,color:"rgba(255,180,180,0.7)",marginBottom:16,lineHeight:1.6}}>Toggle which settlements are visible to players on the Oghill Barony map.</p>

                <div style={{fontSize:10,color:"rgba(255,150,150,0.4)",marginTop:1}}>{rev?"Visible to players":"Hidden from players"}</div>
              </div>
              <button onClick={()=>setRevealedById(s.id,!rev)} style={{fontFamily:"Cinzel",fontSize:11,padding:"5px 14px",borderRadius:4,cursor:"pointer",border:"none",
                background:rev?"rgba(139,26,26,0.5)":"rgba(0,100,0,0.4)",
                color:rev?"#ffaaaa":"#90ee90",letterSpacing:"0.04em"}}>
                {rev?"Hide":"Reveal"}
              </button>
            </div>);
          })}
        </div>
      </>}

      {activeSection==="lore"&&<DMPrivateLore dmLore={dmLore} setDmLore={setDmLore} lore={lore} setLore={setLore}/>}

      {activeSection==="reveal"&&<DMRevealManager lore={lore} setLore={setLore}/>}

    </div>
  </div>);
}

/* DM Private Lore — notes only Josh can see until he reveals them */
function DMPrivateLore({dmLore,setDmLore,lore,setLore}){
  const [selId,setSelId]=useState(null);
  const [newTitle,setNewTitle]=useState("");
  const notes=Object.values(dmLore);
  const selNote=selId?dmLore[selId]:null;
  const addNote=()=>{
    if(!newTitle.trim())return;
    const id="dm_"+Date.now();
    setDmLore(prev=>({...prev,[id]:{id,title:newTitle.trim(),content:"",revealed:false,revealedChunks:[]}}));
    setSelId(id);setNewTitle("");
  };
  const updNote=(f,v)=>setDmLore(prev=>({...prev,[selId]:{...prev[selId],[f]:v}}));

  return(<div style={{display:"flex",gap:16,height:"calc(100vh - 120px)"}}>
    {/* Note list */}
    <div style={{width:200,flexShrink:0,display:"flex",flexDirection:"column",gap:6}}>
      <div style={{fontFamily:"Cinzel",fontSize:11,color:"rgba(255,150,150,0.6)",letterSpacing:"0.06em",marginBottom:4}}>DM PRIVATE NOTES</div>
      {notes.map(n=><div key={n.id} onClick={()=>setSelId(n.id)} style={{padding:"8px 10px",borderRadius:4,cursor:"pointer",
        background:selId===n.id?"rgba(139,26,26,0.5)":"rgba(80,0,0,0.2)",
        border:`1px solid ${selId===n.id?"rgba(200,50,50,0.5)":"rgba(200,50,50,0.15)"}`,
        fontFamily:"Cinzel",fontSize:11,color:n.revealed?"rgba(150,238,150,0.8)":"#ff9999",letterSpacing:"0.04em"}}>
        {n.revealed?"✓ ":""}{n.title}
      </div>)}
      <div style={{display:"flex",gap:4,marginTop:4}}>
        <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addNote()} placeholder="New note title..." style={{fontFamily:"Crimson Pro,serif",background:"rgba(80,0,0,0.2)",border:"1px solid rgba(200,50,50,0.3)",color:"#ffaaaa",borderRadius:3,padding:"4px 7px",flex:1,fontSize:11,outline:"none"}}/>

        <div style={{fontSize:10,color:"rgba(255,150,150,0.5)",fontFamily:"Cinzel",letterSpacing:"0.06em"}}>DM NOTES — Hidden from players until revealed</div>
        <textarea value={selNote.content||""} onChange={e=>updNote("content",e.target.value)}
          placeholder="Write your DM notes here... This is private until you reveal it."
          style={{flex:1,fontFamily:"Crimson Pro,serif",background:"rgba(60,0,0,0.3)",border:"1px solid rgba(200,50,50,0.3)",color:"#ffcccc",borderRadius:6,padding:"12px",fontSize:14,outline:"none",resize:"none",lineHeight:1.7}}/>
        <div style={{display:"flex",gap:8}}>
          {!selNote.revealed
            ?<button onClick={()=>updNote("revealed",true)} style={{fontFamily:"Cinzel",background:"rgba(0,100,0,0.4)",border:"1px solid rgba(100,200,100,0.4)",color:"#90ee90",borderRadius:4,padding:"7px 16px",fontSize:11,cursor:"pointer",flex:1,letterSpacing:"0.06em"}}>
              ✓ Reveal Entire Note to Players
            </button>
            :<button onClick={()=>updNote("revealed",false)} style={{fontFamily:"Cinzel",background:"rgba(139,26,26,0.4)",border:"1px solid rgba(200,50,50,0.4)",color:"#ff9999",borderRadius:4,padding:"7px 16px",fontSize:11,cursor:"pointer",flex:1,letterSpacing:"0.06em"}}>

            style={{fontFamily:"Cinzel",background:"rgba(80,0,0,0.3)",border:"1px solid rgba(200,50,50,0.3)",color:"rgba(255,100,100,0.7)",borderRadius:4,padding:"7px 12px",fontSize:11,cursor:"pointer",letterSpacing:"0.06em"}}>🗑</button>
        </div>

/* DM Reveal Manager — reveal specific lore entries or text chunks to players */
function DMRevealManager({lore,setLore}){
  const [selSection,setSelSection]=useState("allies");
  const [selId,setSelId]=useState(null);
  const [selText,setSelText]=useState("");
  const ALL_SECS=["allies","enemies","factions","settlements","history","sessions","terrain"];
  const items=(lore[selSection]||[]);
  const selItem=selId?items.find(i=>i.id===selId):null;

  const revealEntry=id=>{
    setLore(prev=>({...prev,[selSection]:prev[selSection].map(i=>i.id===id?{...i,dmRevealed:true}:i)}));
  };
  const hideEntry=id=>{
    setLore(prev=>({...prev,[selSection]:prev[selSection].map(i=>i.id===id?{...i,dmRevealed:false}:i)}));
  };
  const revealText=()=>{
    if(!selText.trim()||!selItem)return;
    const existing=(selItem.revealedTexts)||[];
    if(!existing.includes(selText.trim())){
      setLore(prev=>({...prev,[selSection]:prev[selSection].map(i=>i.id===selId?{...i,revealedTexts:[...existing,selText.trim()]}:i)}));
    }
    setSelText("");
  };

  return(<>
    <h2 style={{fontFamily:"Cinzel",fontSize:18,color:"#ff9999",marginBottom:12,letterSpacing:"0.08em"}}>Reveal Manager</h2>
    <p style={{fontSize:13,color:"rgba(255,180,180,0.7)",marginBottom:16,lineHeight:1.6}}>Control what lore players can see. Reveal an entire entry at once, or select specific text to reveal piece by piece.</p>
    <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
      {ALL_SECS.map(s=><button key={s} onClick={()=>{setSelSection(s);setSelId(null);}}
        style={{fontFamily:"Cinzel",fontSize:10,padding:"4px 10px",borderRadius:3,cursor:"pointer",border:"none",
          background:selSection===s?"rgba(139,26,26,0.6)":"rgba(80,0,0,0.3)",
          color:selSection===s?"#ffaaaa":"rgba(255,150,150,0.5)",letterSpacing:"0.04em"}}>
        {s.toUpperCase()}
      </button>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:14,height:"calc(100vh - 260px)"}}>
      <div style={{overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
        {items.length===0&&<div style={{fontSize:11,color:"rgba(255,150,150,0.3)",fontStyle:"italic",padding:"8px 0"}}>No entries yet</div>}
        {items.map(item=><div key={item.id} onClick={()=>setSelId(item.id)}
          style={{padding:"7px 10px",borderRadius:4,cursor:"pointer",
            background:selId===item.id?"rgba(139,26,26,0.5)":"rgba(80,0,0,0.2)",
            border:`1px solid ${item.dmRevealed?"rgba(100,200,100,0.3)":"rgba(200,50,50,0.15)"}`,
            fontFamily:"Cinzel",fontSize:11,color:item.dmRevealed?"#90ee90":"#ff9999",letterSpacing:"0.03em"}}>
          {item.dmRevealed?"✓ ":""}{item.name||"Unnamed"}
        </div>)}
      </div>
      <div style={{overflowY:"auto"}}>
        {selItem?<>
          <div style={{fontFamily:"Cinzel",fontSize:14,color:"#ff9999",marginBottom:10}}>{selItem.name}</div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {!selItem.dmRevealed
              ?<button onClick={()=>revealEntry(selItem.id)} style={{fontFamily:"Cinzel",background:"rgba(0,100,0,0.4)",border:"1px solid rgba(100,200,100,0.4)",color:"#90ee90",borderRadius:4,padding:"6px 14px",fontSize:11,cursor:"pointer",letterSpacing:"0.04em"}}>
                ✓ Reveal Entire Entry
              </button>
              :<button onClick={()=>hideEntry(selItem.id)} style={{fontFamily:"Cinzel",background:"rgba(139,26,26,0.4)",border:"1px solid rgba(200,50,50,0.4)",color:"#ff9999",borderRadius:4,padding:"6px 14px",fontSize:11,cursor:"pointer",letterSpacing:"0.04em"}}>
                ✕ Hide Entry
              </button>}
          </div>
          <div style={{fontSize:10,color:"rgba(255,150,150,0.5)",fontFamily:"Cinzel",letterSpacing:"0.06em",marginBottom:6}}>REVEAL SPECIFIC TEXT</div>
          <p style={{fontSize:11,color:"rgba(255,180,180,0.5)",marginBottom:8,lineHeight:1.5}}>Paste or type specific text from this entry to reveal just that part to players. Players will see these revealed snippets highlighted in gold.</p>
          <textarea value={selText} onChange={e=>setSelText(e.target.value)}
            placeholder="Paste the specific text you want to reveal..."
            style={{width:"100%",fontFamily:"Crimson Pro,serif",background:"rgba(60,0,0,0.3)",border:"1px solid rgba(200,50,50,0.3)",color:"#ffcccc",borderRadius:4,padding:"8px",fontSize:13,outline:"none",resize:"vertical",minHeight:80,lineHeight:1.6,marginBottom:8}}/>
          <button onClick={revealText} disabled={!selText.trim()} style={{fontFamily:"Cinzel",background:"rgba(0,80,0,0.4)",border:"1px solid rgba(100,200,100,0.4)",color:"#90ee90",borderRadius:4,padding:"6px 16px",fontSize:11,cursor:"pointer",opacity:selText.trim()?1:0.4,letterSpacing:"0.04em"}}>
            Reveal Selected Text →
          </button>
          {((selItem.revealedTexts)||[]).length>0&&<>
            <div style={{fontSize:10,color:"rgba(255,150,150,0.5)",fontFamily:"Cinzel",letterSpacing:"0.06em",marginTop:14,marginBottom:6}}>CURRENTLY REVEALED SNIPPETS</div>
            {((selItem.revealedTexts)||[]).map((t,i)=><div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6,padding:"6px 10px",background:"rgba(0,60,0,0.2)",border:"1px solid rgba(100,200,100,0.2)",borderRadius:4}}>
              <div style={{flex:1,fontSize:12,color:"rgba(200,255,200,0.8)",lineHeight:1.5,fontFamily:"Crimson Pro"}}>{t}</div>
              <button onClick={()=>setLore(prev=>({...prev,[selSection]:prev[selSection].map(it=>it.id===selId?{...it,revealedTexts:it.revealedTexts.filter((_,j)=>j!==i)}:it)}))}
                style={{background:"none",border:"none",color:"rgba(255,100,100,0.5)",cursor:"pointer",fontSize:11,flexShrink:0}}>✕</button>
            </div>)}
          </>}
        </>:<div style={{color:"rgba(255,150,150,0.3)",fontFamily:"Cinzel",fontSize:12,marginTop:20}}>Select a lore entry to manage its reveal state</div>}
      </div>
    </div>
  </>);
}

/* ════ ROOT APP ════ */
function App(){
  const [sbCfg,setSbCfg]=useState(()=>{const c=getSBConfig();if(c){initSB(c.url,c.key);return c;}return null;});
  const [data,setData]=useState(null);
  const [syncStatus,setSyncStatus]=useState("idle");
  const [page,setPage]=useState("map");
  const [mapView,setMapView]=useState("world"); // "world" | "barony"
  const [charIdx,setCharIdx]=useState(0);
  const [isDM,setIsDM]=useState(()=>sessionStorage.getItem("sf_dm")==="1");
  // Sync isDM from sessionStorage
  useEffect(()=>{const check=()=>setIsDM(sessionStorage.getItem("sf_dm")==="1");window.addEventListener("storage",check);return()=>window.removeEventListener("storage",check);},[]);

  // Themes
  const THEMES={
    default:{name:"Steel & Fire",dark:"#1a1208",dark2:"#2a1e0a",parch:"#f5ede0",parch2:"#efe4ce",parch3:"#e8d9b8",parch4:"#ddc99a",gold:"#9a7020",gold2:"#c49a30",gold3:"#e8c860",ink:"#2c1a06",ink2:"#5a3e1b",ink3:"#8a6a3a"},
    midnight:{name:"Midnight",dark:"#0a0d1a",dark2:"#111828",parch:"#e8eaf6",parch2:"#dde0f0",parch3:"#cdd2e8",parch4:"#b8bfdb",gold:"#5c6bc0",gold2:"#7986cb",gold3:"#9fa8da",ink:"#1a1f3a",ink2:"#2d3561",ink3:"#5c6490"},
    forest:{name:"Forest",dark:"#0a160a",dark2:"#0f2010",parch:"#edf5ec",parch2:"#dceeda",parch3:"#c9e3c6",parch4:"#b0d4ac",gold:"#2e7d32",gold2:"#43a047",gold3:"#81c784",ink:"#0d1f0d",ink2:"#1b4d1e",ink3:"#4a7c4e"},
    crimson:{name:"Crimson",dark:"#1a0a0a",dark2:"#2a0f0f",parch:"#f5e8e8",parch2:"#eedada",parch3:"#e4c8c8",parch4:"#d4a8a8",gold:"#b71c1c",gold2:"#e53935",gold3:"#ef9a9a",ink:"#2c0a0a",ink2:"#5a1a1a",ink3:"#8a4040"},
  };
  const [themeKey,setThemeKey]=useState(()=>localStorage.getItem("sf_theme")||"default");
  const [showTheme,setShowTheme]=useState(false);
  useEffect(()=>{
    const t=THEMES[themeKey]||THEMES.default;const r=document.documentElement.style;
    Object.entries({dark:t.dark,"dark2":t.dark2,parch:t.parch,parch2:t.parch2,parch3:t.parch3,parch4:t.parch4,gold:t.gold,"gold2":t.gold2,"gold3":t.gold3,ink:t.ink,"ink2":t.ink2,"ink3":t.ink3}).forEach(([k,v])=>r.setProperty(`--${k}`,v));
    localStorage.setItem("sf_theme",themeKey);
  },[themeKey]);

  // Load data
  const hideLoader=()=>{
    if(window.hideAppLoader)window.hideAppLoader();
    else{const ld=document.getElementById("loading-screen");if(ld)ld.style.display="none";}
  };

  useEffect(()=>{
    // ALWAYS show the app immediately using local data or defaults
    // Then try to sync with Supabase in the background
    const localData=localLoad()||DEFAULT_DATA;
    setData(localData);
    hideLoader();

    if(!sbCfg)return; // No config = show setup screen (setData triggers re-render)

    // Background sync - don't block the UI
    const sb=getSB();
    setSyncStatus("syncing");
    const doSync=async()=>{
      try{
        loadAssets(sb).catch(()=>{});
        const raw=await dbLoad(sb);
        if(raw){
          setData(raw);
          localSave(raw);
        } else {
          dbSave(sb,localData).catch(()=>{});
        }
        setSyncStatus("saved");
        setTimeout(()=>setSyncStatus("idle"),2000);
      } catch(err){
        setSyncStatus("error");
      }
    };
    doSync();
  },[sbCfg]);

  // Auto-local-save
  useEffect(()=>{if(data)localSave(data);},[data]);

  const setMapItems=useCallback(fn=>setData(d=>({...d,mapItems:typeof fn==="function"?fn(d.mapItems):fn})),[]);
  const setLore=useCallback(fn=>setData(d=>({...d,lore:typeof fn==="function"?fn(d.lore):fn})),[]);
  const updateChar=useCallback((idx,ch)=>setData(d=>{const cs=[...d.characters];cs[idx]=ch;return{...d,characters:cs};}),[]);

  const manualSave=useCallback(async()=>{
    if(!data)return;setSyncStatus("syncing");localSave(data);
    if(sbCfg){const sb=getSB();
      try{
        // Pull latest, merge, push
        const cloudRaw=await dbLoad(sb);let toSave=data;
        if(cloudRaw){
          const merged={...cloudRaw};
          merged.characters=(data.characters||[]).map((lc,i)=>{const cc=(cloudRaw.characters||[])[i];return cc?{...cc,...lc}:lc;});
          const secs=Object.keys(data.lore||{}).filter(k=>k!=="__customSections");
          merged.lore={...cloudRaw.lore};
          secs.forEach(sec=>{
            const li=data.lore[sec]||[];const ci=(cloudRaw.lore&&cloudRaw.lore[sec])||[];
            const cmap={};ci.forEach(e=>{cmap[e.id]=e;});const lmap={};li.forEach(e=>{lmap[e.id]=e;});
            const ids=new Set([...ci.map(e=>e.id),...li.map(e=>e.id)]);
            merged.lore[sec]=[...ids].map(id=>lmap[id]&&cmap[id]?{...cmap[id],...lmap[id]}:lmap[id]||cmap[id]);
          });
          merged.lore.__customSections=data.lore.__customSections||[];
          merged.mapItems=data.mapItems;merged.mapImage=data.mapImage||cloudRaw.mapImage;merged.baronyImage=data.baronyImage||cloudRaw.baronyImage;
          toSave=merged;
        }
        await dbSave(sb,toSave);localSave(toSave);setData(toSave);setSyncStatus("saved");setTimeout(()=>setSyncStatus("idle"),2000);
      }catch(e){setSyncStatus("error");throw e;}
    }else{setSyncStatus("saved");setTimeout(()=>setSyncStatus("idle"),1500);}
  },[data,sbCfg]);

  const pullLatest=useCallback(async()=>{
    if(!sbCfg)return;setSyncStatus("syncing");const sb=getSB();
    try{const raw=await dbLoad(sb);if(raw){setData(raw);localSave(raw);}setSyncStatus("saved");setTimeout(()=>setSyncStatus("idle"),2000);}
    catch{setSyncStatus("error");}
  },[sbCfg]);

  // Esc key to exit barony view
  useEffect(()=>{
    const onKey=e=>{if(e.key==="Escape"&&mapView==="barony")setMapView("world");};
    window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey);
  },[mapView]);

  if(!sbCfg)return <SetupScreen onSave={cfg=>{initSB(cfg.url,cfg.key);setSbCfg(cfg);}}/>;
  if(!data)return null;

  const syncColor={idle:"transparent",syncing:"var(--gold3)",saved:"rgba(100,200,100,0.8)",error:"var(--red)"}[syncStatus];
  const syncLabel={idle:"",syncing:"⟳",saved:"✓ SAVED",error:"⚠ ERROR"}[syncStatus];

  const NAV=[{id:"map",label:"Map",icon:"🗺"},{id:"lore",label:"Lore",icon:"📜"},{id:"chars",label:"Characters",icon:"⚔"}];

  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",background:"var(--dark)"}}>
    {/* Header */}
    <header style={{display:"flex",alignItems:"center",padding:"0 14px",height:46,borderBottom:"2px solid var(--gold2)",background:"var(--dark2)",flexShrink:0,gap:10}}>
      <h1 style={{fontSize:16,letterSpacing:"0.16em",color:"var(--gold3)",whiteSpace:"nowrap",fontFamily:"Cinzel",textShadow:"0 0 16px rgba(200,160,40,0.3)"}}>⚔ STEEL & FIRE</h1>
      <div style={{width:1,height:20,background:"var(--border2)"}}/>
      <nav style={{display:"flex",gap:3}}>
        {NAV.map(n=><button key={n.id} onClick={()=>setPage(n.id)} className={`btn${page===n.id?" act":""}`} style={{padding:"4px 12px",fontSize:11,fontFamily:"Cinzel",letterSpacing:"0.04em"}}>{n.icon} {n.label}</button>)}
        {/* Tales tab */}
        <button onClick={()=>setPage("tales")} className={`btn${page==="tales"?" act":""}`} style={{padding:"4px 12px",fontSize:11,fontFamily:"Cinzel",letterSpacing:"0.04em",borderColor:"rgba(139,26,26,0.5)",color:page==="tales"?"var(--gold3)":"rgba(200,120,100,0.7)"}}>📖 Tales</button>
        <button onClick={()=>setPage("dm")} className={`btn${page==="dm"?" act":""}`} style={{padding:"4px 12px",fontSize:11,fontFamily:"Cinzel",letterSpacing:"0.04em",borderColor:"rgba(80,0,0,0.6)",color:page==="dm"?"#ff9999":"rgba(200,80,80,0.5)"}}>⚔ DM</button>
      </nav>
      {page==="chars"&&<div style={{display:"flex",gap:3,marginLeft:4}}>
        {data.characters.map((c,i)=><button key={c.id} onClick={()=>setCharIdx(i)} className={`btn${charIdx===i?" act":""}`} style={{padding:"3px 10px",fontSize:11,fontFamily:"Cinzel"}}>{c.name||`Player ${i+1}`}</button>)}
      </div>}
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
        <span style={{fontSize:9,color:syncColor,fontFamily:"Cinzel",letterSpacing:"0.06em",transition:"color .3s",minWidth:60,textAlign:"right"}}>{syncLabel}</span>
        <button onClick={pullLatest} className="btn" style={{fontSize:10,padding:"3px 8px",fontFamily:"Cinzel"}}>⟳</button>
        <button onClick={manualSave} className="btn act" style={{fontSize:10,padding:"3px 10px",fontFamily:"Cinzel",fontWeight:"bold"}}>💾 Save</button>
        <button onClick={()=>setShowTheme(t=>!t)} className={`btn${showTheme?" act":""}`} style={{fontSize:10,padding:"3px 8px",fontFamily:"Cinzel"}}>🎨</button>
        <button onClick={()=>{if(confirm("Change DB settings?\\nThis will reload.")){localStorage.removeItem(SB_KEY);window.location.reload();}}} className="btn" style={{fontSize:10,padding:"3px 8px",fontFamily:"Cinzel"}}>⚙</button>
        <button onClick={()=>{const j=JSON.stringify(data,null,2);const b=new Blob([j],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="steelfire-backup.json";a.click();URL.revokeObjectURL(u);}} className="btn" style={{fontSize:10,padding:"3px 8px",fontFamily:"Cinzel"}}>⬇</button>
        <label className="btn" style={{fontSize:10,padding:"3px 8px",fontFamily:"Cinzel",cursor:"pointer"}}>⬆<input type="file" accept=".json" style={{display:"none"}} onChange={e=>{const f=(e.target.files&&e.target.files[0]);if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(confirm("Replace all data with import?\\nThis cannot be undone.")){setData(p);localSave(p);if(sbCfg){const sb=getSB();dbSave(sb,p).catch(()=>{});}}}catch{alert("Invalid file.");}};r.readAsText(f);e.target.value="";}}/></label>
      </div>
    </header>

    {/* Main */}
    <main style={{flex:1,overflow:"hidden",padding:10,background:"var(--dark)"}}>
      {page==="map"&&(mapView==="world"
        ?<WorldMap data={data} setData={setData} onNavigate={v=>setMapView(v)}/>
        :<BaronyMap data={data} setData={setData} onBack={()=>setMapView("world")} isDM={isDM}/>)}
      {page==="lore"&&<LorePanel lore={data.lore} setLore={setLore} characters={data.characters} readOnly={false}/>}
      {page==="chars"&&<CharSheet char={data.characters[charIdx]} onChange={c=>updateChar(charIdx,c)}/>}
      {page==="tales"&&<TalesPanel/>}
      {page==="dm"&&<DMTab data={data} setData={setData} lore={data.lore} setLore={setLore} sbCfg={sbCfg}/>}
    </main>

    {/* Theme panel */}
    {showTheme&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setShowTheme(false)}>
      <div style={{background:"var(--parch)",border:"2px solid var(--gold2)",borderRadius:10,padding:24,width:420,boxShadow:"0 8px 40px rgba(0,0,0,0.6)"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{fontFamily:"Cinzel",fontSize:15,color:"var(--gold)"}}>🎨 Colour Theme</h3>
          <button onClick={()=>setShowTheme(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"var(--ink3)"}}>✕</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {Object.entries(THEMES).map(([key,t])=><div key={key} onClick={()=>setThemeKey(key)} style={{padding:"10px 14px",borderRadius:6,cursor:"pointer",border:`2px solid ${themeKey===key?"var(--gold2)":"transparent"}`,background:`linear-gradient(135deg,${t.dark2} 0%,${t.dark2} 40%,${t.parch3} 100%)`,display:"flex",alignItems:"center",gap:8}}>
            <div style={{display:"flex",gap:3}}>{[t.dark2,t.gold2,t.parch,t.gold3].map((c,i)=><div key={i} style={{width:12,height:12,borderRadius:"50%",background:c,border:"1px solid rgba(255,255,255,0.2)"}}/>)}</div>
            <span style={{fontFamily:"Cinzel",fontSize:11,color:themeKey===key?"var(--gold3)":"rgba(255,255,255,0.7)"}}>{t.name}</span>
            {themeKey===key&&<span style={{marginLeft:"auto",color:"var(--gold3)",fontSize:12}}>✓</span>}
          </div>)}
        </div>
      </div>
    </div>}
  </div>);
}


class ErrorBoundary extends React.Component{
  constructor(props){
    super(props);
    this.state={error:null};
  }
  componentDidCatch(e,info){
    this.setState({error:e});
    console.error("React error:",e,info);
  }
  render(){
    if(this.state.error){
      return React.createElement("div",{style:{position:"fixed",inset:0,background:"#1a0808",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"monospace",color:"#ff9999"}},
        React.createElement("div",{style:{fontSize:20,marginBottom:16}},"App Error - send this to Harvey:"),
        React.createElement("pre",{style:{fontSize:11,background:"rgba(0,0,0,0.5)",padding:16,borderRadius:4,maxWidth:"90%",overflow:"auto",whiteSpace:"pre-wrap"}},
          String(this.state.error)
        ),
        React.createElement("button",{onClick:()=>this.setState({error:null}),style:{marginTop:16,padding:"8px 20px",background:"#8b1a1a",border:"none",color:"white",borderRadius:4,cursor:"pointer"}},"Retry")
      );
    }
    return this.props.children;
  }
}
ErrorBoundary.getDerivedStateFromError=function(e){return{error:e};};

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
// Babel compiled successfully - app is mounting
console.log("Steel & Fire: React mounted");
const _ld=document.getElementById("loading-screen");
if(_ld)setTimeout(()=>{_ld.style.display="none";},500);
</script>
</body>
